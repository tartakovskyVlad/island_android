<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прыжок на остров</title>

<style>
:root{--bg:#e9f6ff;--ink:#16324a;--panel:#fff;--line:#b9d6ea;--accent:#ff7a3d;--accent-ink:#fff;--wood:#b9824a;--wood-d:#7a4f27;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1f2e;--ink:#e8f3fb;--panel:#183248;--line:#2c4d68}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:12px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar h1{font-size:1.25rem;margin:0;flex:1;min-width:140px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:700;white-space:nowrap}
button{font:inherit;cursor:pointer}
.chip{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scene{position:relative;height:min(68vh,440px);min-height:330px;border-radius:22px;overflow:hidden;border:3px solid var(--ink);direction:ltr;
background:linear-gradient(var(--sky1) 0%,var(--sky2) 52%,var(--sea1) 52%,var(--sea2) 100%)}
.scene{--sky1:#7fd0ff;--sky2:#c8ecff;--sea1:#4fb3e8;--sea2:#2a86c4;--wat1:#2f93d0cc;--wat2:#1c6fa8f2;--sun:#ffd23f;--sun2:#ffd23f55}
.sun{position:absolute;top:22px;right:8%;width:60px;height:60px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 10px var(--sun2)}
.cloud{position:absolute;font-size:46px;top:30px;left:14%;opacity:.9}
.back{position:absolute;left:0;right:0;bottom:0;height:48%}
.island{position:absolute;bottom:30%;width:42%;height:84px;}
.art{position:absolute;inset:0}.art svg{width:100%;height:100%;display:block;overflow:visible}
#i1{left:2%;z-index:3}#i2{right:2%;z-index:2}
.palm{position:absolute;bottom:60%;font-size:44px}
.sign{position:absolute;left:50%;bottom:calc(100% + 66px);transform:translateX(-50%);min-width:150px;white-space:nowrap;text-align:center;background:var(--wood);color:#fff;border:4px solid var(--wood-d);border-radius:12px;padding:8px 18px;font-weight:700;font-size:clamp(1.6rem,6.5vw,2.6rem);box-shadow:0 5px 0 var(--wood-d)}
.sign::after{content:"";position:absolute;left:50%;top:100%;width:8px;height:60px;margin-left:-4px;background:var(--wood-d);z-index:-1}
#ans{width:150px;font:inherit;font-weight:700;font-size:inherit;text-align:center;border:3px dashed #fff;border-radius:8px;background:#ffffff33;color:#fff;padding:0}
#ans::placeholder{color:#ffffffaa}
.avatar{position:absolute;left:50%;bottom:calc(100% - 18px);margin-left:-32px;font-size:60px;line-height:1;animation:bob 1.6s ease-in-out infinite;will-change:transform}
@keyframes bob{50%{translate:0 -4px}}
.front{position:absolute;left:0;right:0;bottom:0;height:36%;z-index:4;pointer-events:none;background:linear-gradient(var(--wat1),var(--wat2));border-top:4px solid #ffffff88}
.msg{position:absolute;left:0;right:0;top:36%;z-index:6;text-align:center;font-weight:700;font-size:clamp(1.2rem,4.5vw,1.9rem);pointer-events:none;text-shadow:0 2px 0 #0006;color:#fff;padding:0 10px}
canvas{position:absolute;inset:0;z-index:5;pointer-events:none;width:100%;height:100%}
.go{display:flex;gap:10px;justify-content:center;margin-top:12px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:12px 26px;font-weight:700;font-size:1.1rem;box-shadow:0 4px 0 #b4501f}
.btn:active{translate:0 3px;box-shadow:0 1px 0 #b4501f}
.over{position:absolute;inset:0;z-index:8;background:#0b1e2ecc;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.over.on{display:flex}.over h2{font-size:2rem;margin:0}
dialog{border:3px solid var(--ink);border-radius:18px;background:var(--panel);color:var(--ink);padding:18px;width:min(92vw,400px);font-family:inherit}
dialog::backdrop{background:#0008}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;font-weight:500}
input[type=number],select{font:inherit;width:90px;padding:6px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.ops{display:flex;gap:8px}.ops label{margin:0}
.ops input{width:20px;height:20px}
#lang{width:auto}dialog{max-height:90vh;overflow:auto}details{margin:12px 0}summary{cursor:pointer;font-weight:700}
textarea{width:100%;font:12px/1.3 monospace;direction:ltr;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:6px}
.hint{font-size:.85rem;opacity:.8;margin:6px 0}
.avatar.pic img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;display:block}
.avs{display:flex;gap:6px;flex-wrap:wrap}
.avs button{font-size:28px;width:48px;height:48px;border-radius:12px;border:3px solid var(--line);background:var(--bg);padding:0;overflow:hidden}
.avs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.avs img{width:100%;height:100%;object-fit:cover;display:block}
.namein{font:inherit;font-size:1.4rem;text-align:center;padding:8px;border-radius:12px;border:3px solid #fff;width:min(80%,260px);background:#fff;color:#16324a}
.scene.v{height:min(80vh,560px);min-height:480px}
.v .island{height:22px}.v .front,.v .sun,.v .cloud{display:none}
.v .palm{bottom:100%;font-size:34px}
.bld{position:absolute;inset:10px 12% 0;display:none;background:linear-gradient(#ffe9a455,#ffe9a455) center/36px 46px space}
.v .bld{display:block}
@media (prefers-reduced-motion:reduce){.avatar{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1 id="t-title"></h1>
    <div class="stat" id="score"></div>
    <div class="stat" id="lives" aria-live="polite"></div>
    <select id="lang" class="chip" aria-label="Language"></select>
    <button class="chip" id="open" aria-label="settings">⚙️</button>
  </div>

  <div class="scene" id="scene">
    <div class="sun"></div><div class="cloud" id="cloud"></div>
    <div class="back"></div><div class="bld"></div>
    <div class="island" id="i1">
      <div class="art" id="art1"></div>
      <div class="sign" id="eq">1 + 1</div>
      <div class="avatar" id="av">🧒</div>
    </div>
    <div class="island" id="i2">
      <div class="art" id="art2"></div>
      <div class="sign"><input id="ans" type="text" inputmode="numeric" autocomplete="off" placeholder="?"></div>
    </div>
    <div class="front"></div>
    <div class="msg" id="msg"></div>
    <canvas id="fx"></canvas>
    <div class="over" id="over"><h2 id="t-over"></h2><div id="final"></div><button class="btn" id="again"></button></div>
    <div class="over" id="welcome"><h2 id="t-ask"></h2>
      <div class="go" style="margin:0"><button class="chip" id="m-ex" type="button"></button><button class="chip" id="m-new" type="button"></button></div>
      <select id="u-sel" class="namein"></select>
      <input id="nm" class="namein" type="text" maxlength="16" autocomplete="off">
      <div id="werr" style="min-height:1.2em;font-size:.95rem" aria-live="polite"></div>
      <button class="btn" id="go"></button></div>
  </div>
  <div class="go"><button class="btn" id="jump"></button></div>
</div>

<dialog id="dlg">
  <h3 id="t-set" style="margin-top:0"></h3>
  <div style="margin:10px 0"><div id="t-player" style="font-weight:500;margin-bottom:6px"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><button class="chip" id="cur-name" type="button"></button><button class="chip" id="b-ex" type="button"></button><button class="chip" id="b-new" type="button"></button></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="chip" id="b-exp" type="button"></button><button class="chip" id="b-imp" type="button"></button><input type="file" id="imp" accept="application/json,.json" hidden></div>
    <div class="hint" id="umsg" aria-live="polite"></div></div>
  <label><span id="t-scene"></span><select id="scene-sel" class="chip" style="width:auto"></select></label>
  <div style="margin:10px 0"><div id="t-avatar" style="font-weight:500;margin-bottom:6px"></div><div class="avs" id="avs"></div><button class="chip" id="upbtn" type="button" style="margin-top:8px"></button><input type="file" id="up" accept="image/*" hidden></div>
  <label><span id="t-min"></span><input type="number" id="s-min"></label>
  <label><span id="t-max"></span><input type="number" id="s-max"></label>
  <label><span id="t-ops"></span>
    <span class="ops">
      <label><input type="checkbox" value="+">+</label>
      <label><input type="checkbox" value="-">−</label>
      <label><input type="checkbox" value="*">×</label>
      <label><input type="checkbox" value="/">÷</label>
    </span></label>
  <label><span id="t-wr"></span><input type="number" id="s-wr" min="1" max="20"></label>
  <details>
    <summary id="t-addlang"></summary>
    <label><span id="t-lname"></span><input type="text" id="lname" style="width:150px" class="chip"></label>
    <label><span id="t-rtl"></span><input type="checkbox" id="rtl"></label>
    <div class="hint" id="t-hint"></div>
    <textarea id="tpl" rows="9" spellcheck="false"></textarea>
    <div class="go"><button class="chip" id="addbtn"></button></div>
    <div class="hint" id="err" aria-live="polite"></div>
  </details>
  <div class="go"><button class="btn" id="save"></button></div>
</dialog>

<dialog id="statdlg">
  <div id="stav" style="font-size:56px;text-align:center"></div>
  <h3 id="stname" style="text-align:center;margin:4px 0 12px"></h3>
  <table id="sttab" style="width:100%;border-collapse:collapse"></table>
  <div class="go"><button class="btn" id="stclose" type="button"></button></div>
</dialog>

<script>
const T={
ru:{name:"Русский",ask:"Кто играет?",usr_ex:"Существующий пользователь",usr_new:"Новый пользователь",taken:"Такое имя уже есть. Выберите «Существующий пользователь».",best:"Рекорд",games:"Игр",load:"Продолжить",create:"Создать",exp:"Экспорт",imp:"Импорт",player:"Игрок",stg:"Сыграно игр",stp:"Всего очков",stl:"Последняя игра",stt:"Рекорд",sts:"решено",close:"Закрыть",bad2:"Неверный файл",scene:"Сцена",sadv:["Ой, не допрыгнул… Бум!","Упс, ты упал…","Неправильно. Попробуй ещё раз!"],start:"Начать",pname:"Имя",avatar:"Аватар",upload:"📷 Своё фото",addlang:"Добавить язык",lname:"Название языка",rtl:false,add:"Добавить",hint:"Переведите только значения, ключи не меняйте. Можно попросить ИИ перевести.",bad:"Ошибка в тексте перевода",title:"Прыжок на остров",score:"Очки",min:"Наименьшее число",max:"Наибольшее число",ops:"Действия",wr:"Ошибок до конца игры",set:"Настройки",save:"Играть",jump:"Прыгнуть!",over:"Игра окончена",again:"Играть снова",good:["Ура! Молодец!","Верно! Отлично!","Правильно! Так держать!"],sad:["Ой, не получилось… Булль!","Упс, ты упал в воду…","Неправильно. Попробуй ещё раз!"]},
he:{name:"עברית",rtl:true,ask:"מי משחק?",usr_ex:"משתמש קיים",usr_new:"משתמש חדש",taken:"השם כבר קיים. בחרו משתמש קיים.",best:"שיא",games:"משחקים",load:"המשך",create:"צור",exp:"ייצוא",imp:"ייבוא",player:"שחקן",stg:"משחקים ששוחקו",stp:"סך הנקודות",stl:"משחק אחרון",stt:"שיא",sts:"נפתרו",close:"סגור",bad2:"קובץ לא תקין",scene:"תפאורה",sadv:["אוי, לא הגעת… בום!","אופס, נפלת…","לא נכון. נסו שוב!"],start:"התחל",pname:"שם",avatar:"דמות",upload:"📷 תמונה משלי",addlang:"הוספת שפה",lname:"שם השפה",add:"הוסף",hint:"תרגמו רק את הערכים, לא את המפתחות. אפשר לבקש מבינה מלאכותית לתרגם.",bad:"שגיאה בטקסט התרגום",title:"קפיצה לאי",score:"נקודות",min:"המספר הקטן ביותר",max:"המספר הגדול ביותר",ops:"פעולות",wr:"טעויות עד סוף המשחק",set:"הגדרות",save:"שחקו",jump:"קפוץ!",over:"המשחק נגמר",again:"שחקו שוב",good:["יששש! כל הכבוד!","נכון! מעולה!","תשובה נכונה! המשך כך!"],sad:["אוי, לא הצליח… בלוב!","אופס, נפלת למים…","לא נכון. נסו שוב!"]},
en:{name:"English",rtl:false,ask:"Who is playing?",usr_ex:"Existing user",usr_new:"New user",taken:"This name already exists. Choose Existing user.",best:"Best",games:"Games",load:"Continue",create:"Create",exp:"Export",imp:"Import",player:"Player",stg:"Games played",stp:"Total points",stl:"Last game",stt:"Top score",sts:"solved",close:"Close",bad2:"Invalid file",scene:"Scene",sadv:["Oh no… thud!","Oops, you fell down…","Not right. Try again!"],start:"Start",pname:"Name",avatar:"Avatar",upload:"📷 Your own photo",addlang:"Add a language",lname:"Language name",add:"Add",hint:"Translate the values only, keep the keys. You can ask an AI to translate.",bad:"The translation text is not valid",title:"Island Hop",score:"Score",min:"Smallest number",max:"Largest number",ops:"Operations",wr:"Mistakes until game over",set:"Settings",save:"Play",jump:"Jump!",over:"Game over",again:"Play again",good:["Hooray! Well done!","Correct! Great!","Right! Keep going!"],sad:["Oh no… splash!","Oops, you fell in the water…","Not right. Try again!"]}
};
/* Scene themes: islands share one geometry (.island boxes); only the drawing inside .art changes.
   Drawings use viewBox 0 0 200 84 with the walking surface at the top. */
const isl=(sand,top)=>`<svg viewBox="0 0 200 84" preserveAspectRatio="none"><ellipse cx="100" cy="46" rx="100" ry="40" fill="${sand}"/><ellipse cx="100" cy="26" rx="86" ry="20" fill="${top}"/></svg>`;
const THEMES={
 tropical:{name:{ru:"Тропики",he:"טרופי",en:"Tropical"},cloud:"☁️",
  vars:{sky1:"#7fd0ff",sky2:"#c8ecff",sea1:"#4fb3e8",sea2:"#2a86c4",wat1:"#2f93d0cc",wat2:"#1c6fa8f2",sun:"#ffd23f",sun2:"#ffd23f55"},
  island1:isl("#f3d98b","#7ed957")+`<span class="palm" style="left:6%">🌴</span>`,
  island2:isl("#f3d98b","#7ed957")+`<span class="palm" style="right:6%">🏝️</span>`},
 arctic:{name:{ru:"Арктика",he:"ארקטי",en:"Arctic"},cloud:"❄️",
  vars:{sky1:"#9fc9e8",sky2:"#e8f4ff",sea1:"#5b8fb5",sea2:"#2a5578",wat1:"#3a6f9acc",wat2:"#2a5578f2",sun:"#fff6c9",sun2:"#fff6c966"},
  island1:isl("#bfe3f5","#ffffff")+`<span class="palm" style="left:6%">🐧</span>`,
  island2:isl("#bfe3f5","#ffffff")+`<span class="palm" style="right:6%">🧊</span>`},
 space:{name:{ru:"Космос",he:"חלל",en:"Space"},cloud:"✨",
  vars:{sky1:"#0a0a2a",sky2:"#2a1a5a",sea1:"#1a1040",sea2:"#0a0820",wat1:"#1a1040cc",wat2:"#0a0820f2",sun:"#e8e8ff",sun2:"#e8e8ff44"},
  island1:isl("#7a5c99","#a98bd0")+`<span class="palm" style="left:6%">🪐</span>`,
  island2:isl("#8a8f99","#b5bac4")+`<span class="palm" style="right:6%">🚀</span>`},
 building:{layout:"v",name:{ru:"Здание",he:"בניין",en:"Building"},cloud:"",
  vars:{sky1:"#7f93b5",sky2:"#b9c6dc",sea1:"#4fb3e8",sea2:"#2a86c4",wat1:"#2f93d0cc",wat2:"#1c6fa8f2",sun:"#ffd23f",sun2:"#ffd23f55"},
  island1:`<svg viewBox="0 0 200 22" preserveAspectRatio="none"><rect width="200" height="22" rx="4" fill="#5b4636"/><rect width="200" height="7" rx="3" fill="#a9825f"/></svg><span class="palm" style="left:6%">🪴</span>`,
  island2:`<svg viewBox="0 0 200 22" preserveAspectRatio="none"><rect width="200" height="22" rx="4" fill="#5b4636"/><rect width="200" height="7" rx="3" fill="#a9825f"/></svg><span class="palm" style="right:6%">🗄️</span>`}
};
const $=id=>document.getElementById(id);
let S={min:1,max:10,ops:["+"],maxWrong:3,lang:"ru",name:"",avatar:"🧒",avatarImg:"",theme:"tropical"};
const AV=["🧒","👧","🦊","🐱","🐼"];
try{Object.assign(S,JSON.parse(localStorage.getItem("islandMath")||"{}"))}catch(e){}
S.custom=S.custom||{};for(const k in S.custom)T[k]={...T.en,...S.custom[k]};if(!T[S.lang])S.lang="ru";
let score=0,wrong=0,busy=false,cur={a:0,b:0,op:"+",ans:0},timers=[];
const SYM={"+":"+","-":"−","*":"×","/":"÷"};
const rnd=(l,h)=>Math.floor(Math.random()*(h-l+1))+l;
const pick=a=>a[Math.floor(Math.random()*a.length)];

function applyLang(){
  const t=T[S.lang];
  document.documentElement.lang=S.lang;
  document.documentElement.dir=t.rtl?"rtl":"ltr";
  document.title=t.title;
  $("t-title").textContent=t.title;$("t-min").textContent=t.min;$("t-max").textContent=t.max;
  $("t-ops").textContent=t.ops;$("t-wr").textContent=t.wr;$("t-set").textContent=t.set;
  $("save").textContent=t.save;$("t-addlang").textContent=t.addlang;$("t-lname").textContent=t.lname;$("t-rtl").textContent=t.rtl_label||"RTL";$("t-hint").textContent=t.hint;$("addbtn").textContent=t.add;$("t-ask").textContent=t.ask;$("go").textContent=mode==="ex"?t.load:t.create;$("m-ex").textContent=t.usr_ex;$("m-new").textContent=t.usr_new;$("t-player").textContent=t.player;$("b-ex").textContent=t.usr_ex;$("b-new").textContent=t.usr_new;$("b-exp").textContent=t.exp;$("b-imp").textContent=t.imp;$("t-avatar").textContent=t.avatar;$("upbtn").textContent=t.upload;$("t-scene").textContent=t.scene;renderScene();
  const sel=$("lang");sel.innerHTML="";for(const k in T){const o=document.createElement("option");o.value=k;o.textContent=T[k].name;sel.appendChild(o)}sel.value=S.lang;$("jump").textContent=t.jump;$("t-over").textContent=t.over;$("again").textContent=t.again;
  
  stats();
}
function stats(){
  $("score").textContent=(S.name?"👤 "+S.name+"  ":"")+T[S.lang].score+": "+score+" ⭐";
  let h="";for(let i=0;i<S.maxWrong;i++)h+=i<wrong?"🖤":"❤️";
  $("lives").textContent=h;
}
function persist(){try{localStorage.setItem("islandMath",JSON.stringify(S))}catch(e){}}

function gen(){
  let lo=Math.min(+S.min,+S.max),hi=Math.max(+S.min,+S.max);
  const op=pick(S.ops);let a,b,ans;
  if(op==="/"){const l=Math.max(lo,1),h=Math.max(hi,1);b=rnd(l,h);const q=rnd(l,h);a=b*q;ans=q}
  else{a=rnd(lo,hi);b=rnd(lo,hi);
    if(op==="-"&&a<b)[a,b]=[b,a];
    ans=op==="+"?a+b:op==="-"?a-b:a*b}
  cur={a,b,op,ans};
  $("eq").textContent=a+" "+SYM[op]+" "+b;
}
function resetRound(){
  timers.forEach(clearTimeout);timers=[];
  $("av").getAnimations().forEach(x=>x.cancel());
  placeIslands();$("av").style.opacity=1;$("msg").textContent="";
  $("ans").value="";busy=false;gen();stats();$("ans").focus({preventScroll:true});
}
function dx(){
  const a=$("i1").getBoundingClientRect(),b=$("i2").getBoundingClientRect(),s=$("scene").getBoundingClientRect(),v=$("av").getBoundingClientRect(),V=$("scene").classList.contains("v");
  return {d:(b.left+b.width/2)-(a.left+a.width/2),dy:V?b.top-a.top:0,fall:s.bottom-v.bottom+30,V};
}
function submit(){
  if(busy||$("over").classList.contains("on"))return;
  const v=$("ans").value.trim();if(v===""||isNaN(+v))return;
  busy=true;$("ans").blur();
  const {d,dy,fall,V}=dx(),av=$("av");
  if(+v===cur.ans){
    av.animate([{transform:"translate(0,0)"},{transform:`translate(${d/2}px,${Math.min(0,dy)-130}px) rotate(180deg)`},{transform:`translate(${d}px,${dy}px) rotate(360deg)`}],{duration:900,easing:"ease-in-out",fill:"forwards"});
    timers.push(setTimeout(()=>{fireworks();$("msg").textContent=S.name+"! "+pick(T[S.lang].good);score++;if(prof){const st=prof.stats;st.correct++;st.totalPoints++;if(score>st.topScore)st.topScore=score;saveProfile()}stats()},900));
    timers.push(setTimeout(resetRound,3600));
  }else{
    wrong++;if(prof){prof.stats.wrong++;saveProfile()}stats();
    av.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${d*.3}px,${Math.min(0,dy)*.5-90}px) rotate(120deg)`,opacity:1,offset:.4},{transform:`translate(${d*.5}px,${V?fall*.5:40}px) rotate(200deg)`,opacity:1,offset:.65},{transform:`translate(${d*.5}px,${V?fall:150}px) rotate(300deg)`,opacity:0}],{duration:1500,easing:"ease-in",fill:"forwards"});
    timers.push(setTimeout(()=>{$("msg").textContent="😢 "+pick(V?T[S.lang].sadv:T[S.lang].sad)},700));
    timers.push(setTimeout(()=>{
      if(wrong>=S.maxWrong){endGame();$("final").textContent=S.name+" — "+T[S.lang].score+": "+score+" ⭐"+(prof?"  |  "+T[S.lang].best+": "+prof.stats.topScore+"  |  "+T[S.lang].games+": "+prof.stats.gamesPlayed:"");$("over").classList.add("on");$("again").focus()}
      else resetRound();
    },2600));
  }
}
function newGame(){score=0;wrong=0;$("over").classList.remove("on");resetRound()}

/* fireworks */
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function fireworks(){
  const r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height;
  for(let k=0;k<7;k++)setTimeout(()=>{
    const x=r.width*(.15+Math.random()*.7),y=r.height*(.12+Math.random()*.35),hue=rnd(0,360);
    for(let i=0;i<46;i++){const an=Math.PI*2*i/46,sp=2+Math.random()*4;
      parts.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,life:1,c:`hsl(${(hue+rnd(-40,40)+360)%360} 100% 60%)`})}
    if(!raf)loop();
  },k*260);
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.99;p.life-=.012;
    cx.globalAlpha=Math.max(p.life,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,2.6,0,7);cx.fill()}
  raf=parts.length?requestAnimationFrame(loop):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

/* events */
$("jump").onclick=submit;
$("ans").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
$("again").onclick=newGame;
$("lang").onchange=e=>{S.lang=e.target.value;persist();applyLang()};
$("addbtn").onclick=()=>{
  const nm=$("lname").value.trim();let d;
  try{d=JSON.parse($("tpl").value)}catch(e){}
  if(!nm||!d||typeof d!=="object"||!Array.isArray(d.good)||!Array.isArray(d.sad)){$("err").textContent=T[S.lang].bad;return}
  const k="x"+Date.now(),c={...d,name:nm,rtl:$("rtl").checked};
  S.custom[k]=c;T[k]={...T.en,...c};S.lang=k;persist();applyLang();$("err").textContent="✓ "+nm;$("lname").value="";
};
$("open").onclick=()=>{
  $("cur-name").textContent="👤 "+(S.name||"—")+" ⓘ";$("umsg").textContent="";$("s-min").value=S.min;$("s-max").value=S.max;$("s-wr").value=S.maxWrong;
  document.querySelectorAll(".ops input").forEach(c=>c.checked=S.ops.includes(c.value));
  const tpl={...T.en};delete tpl.name;delete tpl.rtl;$("tpl").value=JSON.stringify(tpl,null,1);$("err").textContent="";
  $("dlg").showModal();
};
$("save").onclick=()=>{
  let mn=parseInt($("s-min").value),mx=parseInt($("s-max").value),w=parseInt($("s-wr").value);
  if(isNaN(mn))mn=1;if(isNaN(mx))mx=10;if(mn>mx)[mn,mx]=[mx,mn];
  const ops=[...document.querySelectorAll(".ops input:checked")].map(c=>c.value);
  S.min=mn;S.max=mx;S.ops=ops.length?ops:["+"];S.maxWrong=Math.min(20,Math.max(1,w||3));
  persist();saveProfile();$("dlg").close();newGame();
};
/* ---- local "REST-like" data layer: profiles stored as JSON, keyed by lower-cased name.
   Swap the bodies of DB.* for fetch() calls later to use a server. ---- */
const key=n=>n.trim().toLowerCase();
/* Android (Capacitor): users.json lives in the app data folder. DB stays synchronous via an in-memory cache. */
const FS=(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())?Capacitor.Plugins.Filesystem:null;
let cache={},wq=Promise.resolve();
const queue=t=>{wq=wq.then(()=>FS.writeFile({path:"users.json",data:t,directory:"DATA",encoding:"utf8"})).catch(()=>{})};
async function loadFile(){if(!FS)return;try{const r=await FS.readFile({path:"users.json",directory:"DATA",encoding:"utf8"});cache=JSON.parse(r.data||"{}")}catch(e){cache={}}}
const DB={
  all(){try{if(FS)return cache;const raw=window.appData?window.appData.read():localStorage.getItem("islandMathUsers");return JSON.parse(raw||"{}")}catch(e){return {}}},
  write(d){try{if(FS){cache=d;queue(JSON.stringify(d,null,2))}else if(window.appData)window.appData.write(JSON.stringify(d,null,2));else localStorage.setItem("islandMathUsers",JSON.stringify(d))}catch(e){}},
  get(n){return this.all()[key(n)]||null},
  put(p){const d=this.all();d[key(p.name)]=p;this.write(d)},
  names(){return Object.values(this.all()).map(p=>p.name).sort()}
};
let prof=null,mode="new";
const snap=()=>S.avatar==="img"&&S.avatarImg?{type:"img",value:S.avatarImg}:{type:"emoji",value:AV.includes(S.avatar)?S.avatar:AV[0]};
const cfg=()=>({min:S.min,max:S.max,ops:S.ops,maxWrong:S.maxWrong,lang:S.lang,theme:S.theme});
function saveProfile(){if(!prof)return;prof.avatar=snap();prof.settings=cfg();prof.updatedAt=new Date().toISOString();DB.put(prof)}
function createProfile(n){
  const now=new Date().toISOString();
  prof={id:"u"+Date.now().toString(36),name:n,avatar:snap(),settings:cfg(),stats:{topScore:0,gamesPlayed:0,totalPoints:0,correct:0,wrong:0,lastGame:null},createdAt:now,updatedAt:now};
  S.name=n;persist();DB.put(prof);
}
function loadProfile(p){
  p.stats=Object.assign({topScore:0,gamesPlayed:0,totalPoints:0,correct:0,wrong:0,lastGame:null},p.stats);
  if(p.stats.bestScore!==undefined){p.stats.topScore=Math.max(p.stats.topScore,p.stats.bestScore);delete p.stats.bestScore}
  prof=p;S.name=p.name;
  if(p.avatar&&p.avatar.type==="img"){S.avatar="img";S.avatarImg=p.avatar.value}
  else if(p.avatar){S.avatar=p.avatar.value;S.avatarImg=""}
  Object.assign(S,p.settings||{});persist();
}
function endGame(){if(prof){const s=prof.stats;s.gamesPlayed++;s.topScore=Math.max(s.topScore,score);s.lastGame={date:new Date().toISOString(),totalSolved:score};saveProfile()}}
function setMode(m){
  mode=m;const t=T[S.lang],ex=m==="ex";
  $("u-sel").style.display=ex?"":"none";$("nm").style.display=ex?"none":"";
  $("m-ex").setAttribute("aria-pressed",ex);$("m-new").setAttribute("aria-pressed",!ex);
  $("go").textContent=ex?t.load:t.create;$("werr").textContent="";
  if(ex){const s=$("u-sel");s.innerHTML="";DB.names().forEach(n=>{const o=document.createElement("option");o.value=o.textContent=n;s.appendChild(o)});if(prof)s.value=prof.name}
  else $("nm").focus();
}
$("m-ex").onclick=()=>setMode("ex");$("m-new").onclick=()=>setMode("new");
function showWelcome(m){
  saveProfile();busy=true;timers.forEach(clearTimeout);timers=[];
  $("welcome").classList.add("on");$("m-ex").disabled=!DB.names().length;$("nm").value="";
  setMode(m||(DB.names().length?"ex":"new"));
}
$("b-ex").onclick=()=>{$("dlg").close();showWelcome("ex")};
$("b-new").onclick=()=>{$("dlg").close();showWelcome("new")};
async function saveFile(name,text){
  if(FS){try{await FS.writeFile({path:name,data:text,directory:"DOCUMENTS",encoding:"utf8"});$("umsg").textContent="✓ Documents/"+name}catch(e){$("umsg").textContent="✗ "+name}return}
  try{const dl=window.claude&&await claude.use("downloads");if(dl){await dl.save({filename:name,data:text});return}}catch(e){}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;a.click();
}
$("b-exp").onclick=()=>{saveProfile();saveFile("island-math-users.json",JSON.stringify(Object.values(DB.all()),null,2))};
$("b-imp").onclick=()=>$("imp").click();
$("imp").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))d=Object.values(d);let n=0;
    d.forEach(p=>{if(p&&typeof p.name==="string"&&p.stats&&typeof p.stats==="object"){DB.put(p);n++}});
    if(prof&&DB.get(prof.name))prof=DB.get(prof.name);
    $("umsg").textContent=n?"✓ "+n:T[S.lang].bad2}catch(x){$("umsg").textContent=T[S.lang].bad2}};
  r.readAsText(f);e.target.value="";
};
function showStats(){
  if(!prof)return;const t=T[S.lang],s=prof.stats,ap=prof.avatar||snap(),box=$("stav");
  box.textContent="";
  if(ap.type==="img"){const i=new Image();i.src=ap.value;i.alt="";i.style.cssText="width:72px;height:72px;border-radius:50%;object-fit:cover";box.appendChild(i)}else box.textContent=ap.value;
  $("stname").textContent=prof.name;
  let last="—";
  if(s.lastGame){const loc=S.lang==="he"?"he-IL":S.lang==="ru"?"ru-RU":"en-GB";
    last=new Date(s.lastGame.date).toLocaleString(loc,{dateStyle:"short",timeStyle:"short"})+" · "+s.lastGame.totalSolved+" "+t.sts}
  const tb=$("sttab");tb.innerHTML="";
  [[t.stg,s.gamesPlayed],[t.stp,s.totalPoints],[t.stl,last],[t.stt,s.topScore]].forEach(([k,v])=>{
    const tr=document.createElement("tr"),c1=document.createElement("td"),c2=document.createElement("td");
    c1.textContent=k;c2.textContent=v;c2.style.fontWeight="700";c2.style.textAlign="end";
    c1.style.padding=c2.style.padding="8px 4px";tr.style.borderBottom="1px solid var(--line)";
    tr.append(c1,c2);tb.appendChild(tr)});
  $("stclose").textContent=t.close;$("statdlg").showModal();
}
$("cur-name").onclick=showStats;$("stclose").onclick=()=>$("statdlg").close();
function renderAvatar(){
  const av=$("av");av.textContent="";
  if(S.avatar==="img"&&S.avatarImg){const i=new Image();i.src=S.avatarImg;i.alt="";av.appendChild(i);av.classList.add("pic")}
  else{av.classList.remove("pic");av.textContent=AV.includes(S.avatar)?S.avatar:AV[0]}
  const box=$("avs");box.innerHTML="";
  const add=(content,val)=>{const b=document.createElement("button");b.type="button";if(typeof content==="string")b.textContent=content;else b.appendChild(content);
    b.setAttribute("aria-pressed",S.avatar===val);b.onclick=()=>{S.avatar=val;persist();renderAvatar()};box.appendChild(b)};
  AV.forEach(e=>add(e,e));
  if(S.avatarImg){const i=new Image();i.src=S.avatarImg;i.alt="";add(i,"img")}
}
const FL=["4%","37%","70%"];
/* vertical scenes: two different floors are picked each round; floors zig-zag left/right */
function placeIslands(){
  const V=$("scene").classList.contains("v");
  let f=[0,1];
  if(V){f[0]=rnd(0,2);do{f[1]=rnd(0,2)}while(f[1]===f[0])}
  ["i1","i2"].forEach((id,i)=>{const e=$(id).style;
    if(V){e.bottom=FL[f[i]];e.left=f[i]%2?"auto":"2%";e.right=f[i]%2?"2%":"auto"}
    else{e.bottom=e.left=e.right=""}});
}
function renderScene(){
  const th=THEMES[S.theme]||THEMES.tropical,sc=$("scene");
  sc.classList.toggle("v",th.layout==="v");
  for(const k in th.vars)sc.style.setProperty("--"+k,th.vars[k]);
  $("art1").innerHTML=th.island1;$("art2").innerHTML=th.island2;$("cloud").textContent=th.cloud;
  const sel=$("scene-sel");sel.innerHTML="";
  for(const k in THEMES){const o=document.createElement("option");o.value=k;o.textContent=THEMES[k].name[S.lang]||THEMES[k].name.en;sel.appendChild(o)}
  sel.value=S.theme in THEMES?S.theme:"tropical";placeIslands();
}
$("scene-sel").onchange=e=>{S.theme=e.target.value;persist();renderScene()};
$("upbtn").onclick=()=>$("up").click();
$("up").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const c=document.createElement("canvas");c.width=c.height=128;const s=Math.min(im.width,im.height);
    c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);
    S.avatarImg=c.toDataURL("image/jpeg",.85);S.avatar="img";persist();renderAvatar()};im.src=r.result};
  r.readAsDataURL(f);e.target.value="";
};

$("go").onclick=()=>{
  if(mode==="ex"){const p=DB.get($("u-sel").value);if(!p)return;loadProfile(p)}
  else{const v=$("nm").value.trim();if(!v){$("nm").focus();return}
    if(DB.get(v)){$("werr").textContent=T[S.lang].taken;return}
    createProfile(v)}
  $("welcome").classList.remove("on");renderAvatar();applyLang();newGame();
};
$("nm").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
async function start(){
  await loadFile();
  const p=S.name&&DB.get(S.name);if(p)loadProfile(p);else if(S.name)createProfile(S.name);
  renderAvatar();applyLang();newGame();if(!prof)showWelcome();
}
start();
window.addEventListener("beforeunload",saveProfile);
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveProfile()});
</script>
